<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOM — небо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Commissioner:wght@400;500&display=swap">
<style>
html,body{margin:0}

/* Layout: one full-screen night sky over a pine ridge; quiet title top-left, single action bottom-centre. Deliberately single dark theme. */
:root{
  --night:#02040a; --ink:#eef2f8; --soft:rgba(238,242,248,.62); --edge:rgba(238,242,248,.26);
  --display:"Unbounded", "Commissioner", system-ui, sans-serif;
  --body:"Commissioner", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden}
.scene{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:20px;left:20px;right:20px;pointer-events:none}
.eyebrow{font-size:14px;letter-spacing:.06em;color:var(--soft);text-shadow:0 1px 10px rgba(0,0,0,.6)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.4vw,30px);margin:6px 0 0;letter-spacing:.01em;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.bottom{position:absolute;left:16px;right:16px;bottom:max(24px, env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:center;gap:10px}
.cta{font-family:var(--display);font-size:16px;color:var(--ink);text-decoration:none;padding:15px 28px;border:1px solid var(--edge);border-radius:999px;background:rgba(2,4,10,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .2s}
.cta:hover{border-color:var(--soft)}
.hint{font-size:13px;color:var(--soft);text-align:center}
/* поки чекаємо на зірку після донату: кнопка тепло світиться, а по рамці біжить вогник */
.cta{position:relative}
.cta.wait{border-color:rgba(255,226,180,.32);box-shadow:0 0 26px rgba(255,214,160,.16)}
.cta.wait::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--orbit),transparent 0 62%,rgba(255,226,180,.25) 78%,rgba(255,240,214,1) 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:orbit 2.6s linear infinite}
@property --orbit{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes orbit{to{--orbit:360deg}}
@media (prefers-reduced-motion:reduce){.cta.wait::before{animation:none;background:rgba(255,226,180,.6)}}
.stars{position:absolute;right:20px;bottom:max(28px, env(safe-area-inset-bottom, 0px));font-size:14px;letter-spacing:.04em;color:var(--soft);text-shadow:0 1px 10px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;pointer-events:none}
.stars b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink);margin-right:6px}
@media (max-width:560px){.stars{bottom:auto;top:20px}}
.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div class="scene">
  <canvas id="sky" role="img" aria-label="Нічне небо над лісом, що повільно пливе: кожен донат команди LOM — окрема зірка, що більший донат, то більша зірка"></canvas>
  <div class="top">
    <div class="eyebrow">LOM — небо</div>
  </div>
  <div class="stars" id="stars" aria-live="polite"></div>
  <div class="bottom">
    <a class="cta" href="https://send.monobank.ua/jar/7RCpufUM7h" target="_blank" rel="noopener">Запалити зірку</a>
    <div class="hint">Кожен донат — нова зірка. Що більший донат, то яскравіша зірка</div>
  </div>
</div>

<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sky=document.getElementById('sky');
  const DRIFT=1/900;                 // the sky drifts sideways: one full loop every 15 minutes
  const M=40;                        // stars leave the screen fully before they wrap round
  let W=0,H=0,dpr=1,P=0,horizonY=0;
  let skyGrad=null,band=null,fg=null,ready=false;
  // Адреса вашого Worker-а. Після деплою замініть на свою, наприклад https://lom-sky.ваш-субдомен.workers.dev/api/sky
  const API='https://lom-sky.lom-team.workers.dev/api/sky';
  const POLL_MS=60000;
  // після натискання «Запалити зірку» сторінка кілька хвилин чекає на донат і питає Worker частіше
  const WAIT_MS=5*60000, WAIT_POLL_MS=5000;
  let waitFrom=0;
  // зірки приходять з Worker-а: [ключ, сума, час у Unix-секундах, підпис?]. Ключ постійний, тож місце зірки на небі не змінюється.
  // Підпис є лише в зірок людей, які самі написали в коментарі «★ Ім'я»; анонімні зірки між собою ніяк не пов'язані
  const DONATIONS=[]; const KEYS=[]; const TIMES=[]; const SIGS=[]; const known=new Set(); const idx=new Map();
  function seedOf(key){let h=2166136261;for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619);}return h|0;}
  // star size: 100 ₴ = smallest, 1000 ₴ and more = largest, logarithmic in between
  function sizeFor(v){const f=Math.min(1,Math.max(0,Math.log10(v/100)));return 0.7+1.9*f;}
  let sotky=0; const sot=[]; const born={}; const meteors=[]; const labels=[]; const t0=performance.now();
  // підсвічування: наведення (чи дотик) на підписану зірку запалює всі зірки цієї людини, на анонімну — лише її саму
  const hl={i:-1,f:0}; let ptr=null,tap=-1,tapAt=0,lastNow=0,cursorOn=false;
  const LABEL_MS=5000; // скільки висить підпис «+100 ₴» біля нової зірки

  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v);}
  function h2(i,j,s){let h=Math.imul(i,374761393)+Math.imul(j,668265263)+Math.imul(s,1442695041);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
  function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
  function fbm(x,y,s){let f=0,a=0.5;for(let o=0;o<5;o++){f+=a*vn(x,y,s+o*31);x*=2.03;y*=2.03;a*=0.5;}return f;}
  function smooth(e0,e1,x){const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
  function starColor(r){const x=r();if(x<0.1)return[165,190,255];if(x<0.42)return[215,226,255];if(x<0.78)return[255,248,236];if(x<0.93)return[255,224,178];return[255,192,145];}

  function build(){
    horizonY=H*0.84;

    // fixed sky gradient with a faint town glow on the far left
    skyGrad=document.createElement('canvas');skyGrad.width=W;skyGrad.height=H;
    let c=skyGrad.getContext('2d');let g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#010309');g.addColorStop(0.5,'#040917');g.addColorStop(0.78,'#0a1529');g.addColorStop(0.9,'#13223b');g.addColorStop(1,'#1a2a44');
    c.fillStyle=g;c.fillRect(0,0,W,H);
    g=c.createRadialGradient(W*0.08,horizonY,0,W*0.08,horizonY,H*0.55);g.addColorStop(0,'rgba(120,92,64,0.16)');g.addColorStop(1,'rgba(120,92,64,0)');
    c.fillStyle=g;c.fillRect(0,0,W,H);

    // Milky Way as a horizontally seamless tile, so it can drift and wrap with the stars
    P=W+2*M;
    band=document.createElement('canvas');band.width=P;band.height=H;c=band.getContext('2d');
    const Q=4,LW=Math.ceil(P/Q),LH=Math.ceil(H/Q),low=document.createElement('canvas');low.width=LW;low.height=LH;
    const lc=low.getContext('2d'),img=lc.createImageData(LW,LH),px=img.data;
    const per=(X,Y,f)=>((P-X)*f(X,Y)+X*f(X-P,Y))/P;   // blend two copies so the right edge meets the left one
    const xCore=P*0.62;
    for(let j=0;j<LH;j++){for(let i=0;i<LW;i++){
      const X=i*Q,Y=j*Q;
      const yc=H*(0.34+0.17*Math.sin(6.2832*X/P+0.8)+0.05*Math.sin(12.566*X/P+2.1));
      const w=H*0.13*(0.8+0.45*per(X,Y,(x)=>fbm(x*0.0025,7.7,3)));
      const d=Y-yc,across=Math.exp(-(d*d)/(w*w));if(across<0.004)continue;
      const clump=per(X,Y,(x,y)=>fbm(x*0.0055,y*0.0055,11));
      let dens=across*(0.35+1.1*clump*clump);
      const lane=smooth(0.5,0.66,per(X,Y,(x,y)=>fbm(x*0.009+40,y*0.009,23)))*Math.exp(-(d*d)/(w*w*0.18));
      dens*=1-0.88*lane;
      let dx=Math.abs(X-xCore);dx=Math.min(dx,P-dx);
      const core=Math.exp(-(dx*dx)/(P*P*0.012))*Math.exp(-(d*d)/(w*w*1.4))*(1-0.8*lane);
      const I=Math.min(1,dens*0.2+core*0.15),k=(j*LW+i)*4,m=Math.min(1,core*1.1);
      px[k]=170+85*m;px[k+1]=188+28*m;px[k+2]=228-60*m;px[k+3]=I*255;
    }}
    lc.putImageData(img,0,0);
    c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';c.drawImage(low,0,0,LW*Q,LH*Q);

    // fixed foreground: haze, airglow, pine ridge
    fg=document.createElement('canvas');fg.width=W;fg.height=H;c=fg.getContext('2d');
    g=c.createLinearGradient(0,horizonY-H*0.3,0,horizonY);g.addColorStop(0,'rgba(14,26,46,0)');g.addColorStop(1,'rgba(18,32,56,0.62)');
    c.fillStyle=g;c.fillRect(0,horizonY-H*0.3,W,H*0.3);
    g=c.createLinearGradient(0,horizonY-H*0.2,0,horizonY);g.addColorStop(0,'rgba(140,60,70,0)');g.addColorStop(0.45,'rgba(140,60,70,0.03)');g.addColorStop(0.75,'rgba(70,140,95,0.06)');g.addColorStop(1,'rgba(70,140,95,0.02)');
    c.fillStyle=g;c.fillRect(0,horizonY-H*0.2,W,H*0.2);
    const rr=rng(77),ph=[rr()*6,rr()*6,rr()*6],ridge=x=>{const k=x/W;return horizonY+H*0.028*Math.sin(k*2.7+ph[0])+H*0.016*Math.sin(k*6.9+ph[1])+H*0.006*Math.sin(k*15+ph[2]);};
    c.fillStyle='#010205';c.beginPath();c.moveTo(0,H);for(let x=0;x<=W+6;x+=6)c.lineTo(x,ridge(x));c.lineTo(W,H);c.closePath();c.fill();
    const sc=Math.max(0.6,H/900);
    for(let x=-10;x<W+10;){ // pines along the ridge, in clumps
      const dense=vn(x*0.012,0.5,91);const step=(dense>0.45?5:16)+rr()*10;
      if(dense>0.3){const h=(16+rr()*38)*sc*(0.6+dense),y=ridge(x)+2,wv=h*0.32;
        c.beginPath();c.moveTo(x,y-h);
        for(let t=1;t<=5;t++){const yy=y-h+h*t/5,ww=wv*t/5;c.lineTo(x+ww*(1.1+rr()*0.3),yy);c.lineTo(x+ww*0.45,yy);}
        c.lineTo(x+wv*0.12,y+4);c.lineTo(x-wv*0.12,y+4);
        for(let t=5;t>=1;t--){const yy=y-h+h*t/5,ww=wv*t/5;c.lineTo(x-ww*0.45,yy);c.lineTo(x-ww*(1.1+rr()*0.3),yy-(t===1?0:0));}
        c.closePath();c.fill();}
      x+=step;
    }
    ready=true;
  }

  // each star has a fixed spot on the whole sky: u across (wraps round), v from the top down to the treeline
  function sotStar(i){
    while(sot.length<=i){const k=sot.length,r=rng(seedOf(KEYS[k]));
      sot.push({u:r(),v:r(),ph:r()*6.28,sp:1.2+r()*2.4,s:sizeFor(DONATIONS[k])*(0.94+r()*0.12),col:r()<0.3?[255,232,198]:(r()<0.3?[200,220,255]:[240,245,255])});}
    return sot[i];
  }
  function shiftAt(now){return reduce?0:(((now-t0)/1000*DRIFT)%1);}
  function sotPos(i,sh){const p=sotStar(i);return[((p.u+sh)%1)*P-M,H*(0.05+0.73*p.v)];}

  function psf(c,x,y,s,a,col){
    const rad=s<=1?7*s:7+3.2*(s-1),g=c.createRadialGradient(x,y,0,x,y,rad),rgb=col[0]+','+col[1]+','+col[2];
    g.addColorStop(0,'rgba('+rgb+','+(0.85*a)+')');g.addColorStop(0.15,'rgba('+rgb+','+(0.32*a)+')');g.addColorStop(0.45,'rgba('+rgb+','+(0.07*a)+')');g.addColorStop(1,'rgba('+rgb+',0)');
    c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);
    c.fillStyle='rgba(255,255,255,'+a+')';c.beginPath();c.arc(x,y,1.05*s,0,6.2832);c.fill();
  }
  function heightDim(y){return 1-0.55*smooth(horizonY-H*0.35,horizonY,y);} // extinction near the horizon
  function twinkle(p,t,y){const near=smooth(horizonY-H*0.45,horizonY,y);return 1-(0.12+0.35*near)*(0.5+0.5*Math.sin(t*p.sp+p.ph))*(0.6+0.4*Math.sin(t*p.sp*2.7+p.ph*1.3));}

  function spawnMeteor(now,target){
    const r=Math.random;
    if(target!==undefined){const ang=-2.35+(r()-0.5)*0.5,len=H*(0.35+r()*0.15);meteors.push({target,start:now,dur:1000,ang,len});return;}
    const x=W*(0.1+r()*0.8),y=H*(0.05+r()*0.4),ang=0.5+r()*1.2+(r()<0.5?0:Math.PI*0.6);
    meteors.push({x,y,ang,dist:H*(0.18+r()*0.25),start:now,dur:600+r()*600,tail:70+r()*120});
  }

  function starAt(px,py,sh,r){
    let best=-1,bd=r*r;
    for(let i=0;i<sotky;i++){if(born[i]===null)continue;const [x,y]=sotPos(i,sh),d=(x-px)*(x-px)+(y-py)*(y-py);if(d<bd){bd=d;best=i;}}
    return best;
  }
  function frame(now){
    if(!ready)return;
    const c=sky.getContext('2d'),t=(now-t0)/1000,sh=shiftAt(now),off=sh*P-M;
    const dt=Math.min(100,now-(lastNow||now));lastNow=now;
    if(tap>=0&&now-tapAt>4000)tap=-1;
    const target=ptr?starAt(ptr.x,ptr.y,sh,22):tap;
    if(target>=0)hl.i=target;
    hl.f+=((target>=0?1:0)-hl.f)*Math.min(1,dt/(target>=0?120:350));
    if(hl.f<0.01&&target<0)hl.i=-1;
    const on=target>=0;if(on!==cursorOn){cursorOn=on;sky.style.cursor=on?'pointer':'';}
    const hlName=hl.i>=0?SIGS[hl.i]:null;
    c.setTransform(dpr,0,0,dpr,0,0);c.globalCompositeOperation='source-over';
    c.drawImage(skyGrad,0,0,W,H);
    c.globalCompositeOperation='lighter';
    c.drawImage(band,off,0);c.drawImage(band,off-P,0);
    for(let i=0;i<sotky;i++){
      const p=sotStar(i),[x,y]=sotPos(i,sh);if(x<-30||x>W+30)continue;let a=reduce?0.95:twinkle(p,t,y),s=p.s;
      if(born[i]!==undefined){const b=born[i];if(b===null)continue;const k=(now-b)/1600;if(k<0)continue;if(k<1){a=Math.min(1,k*4);s*=1+2.6*Math.pow(1-k,2.2);}else delete born[i];}
      let aa=a*heightDim(y);
      if(hl.f>0){
        if(i===hl.i||(hlName&&SIGS[i]===hlName)){psf(c,x,y,s,aa,p.col);const pu=reduce?1:0.85+0.15*Math.sin(t*3+i),R=14+6*s;const g=c.createRadialGradient(x,y,0,x,y,R);g.addColorStop(0,'rgba(255,222,160,'+(0.5*hl.f*pu)+')');g.addColorStop(0.35,'rgba(255,214,150,'+(0.16*hl.f*pu)+')');g.addColorStop(1,'rgba(255,214,150,0)');c.fillStyle=g;c.fillRect(x-R,y-R,R*2,R*2);psf(c,x,y,s*1.3,hl.f,[255,236,200]);
          if(s>2){const L=(7+3.2*(s-1))*1.15;c.strokeStyle='rgba(255,255,255,'+(0.1*aa)+')';c.lineWidth=0.6;c.beginPath();c.moveTo(x-L,y);c.lineTo(x+L,y);c.moveTo(x,y-L);c.lineTo(x,y+L);c.stroke();}
          continue;}
        aa*=1-0.5*hl.f;
      }
      psf(c,x,y,s,aa,p.col);
      if(s>2){const L=(7+3.2*(s-1))*1.15;c.strokeStyle='rgba(255,255,255,'+(0.1*aa)+')';c.lineWidth=0.6;c.beginPath();c.moveTo(x-L,y);c.lineTo(x+L,y);c.moveTo(x,y-L);c.lineTo(x,y+L);c.stroke();}
    }
    for(let m=meteors.length-1;m>=0;m--){
      const o=meteors[m],k=(now-o.start)/o.dur;if(k<0)continue;if(k>=1){if(o.target!==undefined){born[o.target]=now;labels.push({i:o.target,start:now});}meteors.splice(m,1);continue;}
      let hx,hy,tx,ty,alpha;
      if(o.target!==undefined){const [ex,ey]=sotPos(o.target,sh),e=k*k*(3-2*k);const sx=ex-Math.cos(o.ang)*o.len,sy=ey-Math.sin(o.ang)*o.len;
        hx=sx+(ex-sx)*e;hy=sy+(ey-sy)*e;const tl=o.len*0.38*(1-k*0.5);tx=hx-Math.cos(o.ang)*tl;ty=hy-Math.sin(o.ang)*tl;alpha=0.9;}
      else{const e=k;hx=o.x+Math.cos(o.ang)*o.dist*e;hy=o.y+Math.sin(o.ang)*o.dist*e;const tl=o.tail*Math.min(1,k*3);tx=hx-Math.cos(o.ang)*tl;ty=hy-Math.sin(o.ang)*tl;alpha=Math.sin(Math.PI*k);}
      const g=c.createLinearGradient(hx,hy,tx,ty);g.addColorStop(0,'rgba(255,255,255,'+alpha+')');g.addColorStop(0.3,'rgba(200,220,255,'+(alpha*0.35)+')');g.addColorStop(1,'rgba(200,220,255,0)');
      c.strokeStyle=g;c.lineWidth=1.6;c.lineCap='round';c.beginPath();c.moveTo(hx,hy);c.lineTo(tx,ty);c.stroke();
      psf(c,hx,hy,0.6,alpha,[235,242,255]);
    }
    // поки чекаємо на зірку, за лісом ледь помітно пульсує світло
    if(waitFrom){const pulse=reduce?0.6:0.5+0.5*Math.sin(t*1.6),gx=W/2,gy=horizonY,R=Math.max(W*0.35,H*0.5),g=c.createRadialGradient(gx,gy,0,gx,gy,R);
      g.addColorStop(0,'rgba(255,232,196,'+(0.05+0.06*pulse)+')');g.addColorStop(0.5,'rgba(255,232,196,'+(0.015+0.02*pulse)+')');g.addColorStop(1,'rgba(255,232,196,0)');
      c.fillStyle=g;c.fillRect(gx-R,gy-R,R*2,R);}
    c.globalCompositeOperation='source-over';
    c.drawImage(fg,0,0,W,H);
    // підпис суми біля нової зірки: з'являється, повільно піднімається і тане
    for(let n=labels.length-1;n>=0;n--){
      const l=labels[n],k=(now-l.start)/LABEL_MS;if(k<0)continue;if(k>=1){labels.splice(n,1);continue;}
      const [sx,sy]=sotPos(l.i,sh);const a=Math.min(1,k/0.08)*(k>0.7?1-(k-0.7)/0.3:1);
      const txt='+'+DONATIONS[l.i].toLocaleString('uk-UA')+' ₴'+(SIGS[l.i]?' · '+SIGS[l.i]:'');
      label(c,txt,sx,sy-(reduce?0:22*k),a);
    }
    // підпис біля зірки під курсором: ім'я, а в анонімної — сума
    if(hl.i>=0&&hl.f>0.01){const [sx,sy]=sotPos(hl.i,sh);label(c,hlName||'+'+DONATIONS[hl.i].toLocaleString('uk-UA')+' ₴',sx,sy,hl.f);}
  }
  function label(c,txt,sx,sy,a){
    c.font='500 15px "Commissioner", system-ui, sans-serif';const tw=c.measureText(txt).width;
    let tx=sx+14,ty=sy-12;if(tx+tw>W-12)tx=sx-14-tw;if(ty<20)ty=sy+24;
    c.save();c.globalAlpha=a;c.shadowColor='rgba(0,0,0,0.7)';c.shadowBlur=8;c.fillStyle='rgba(255,244,222,0.95)';c.fillText(txt,tx,ty);c.restore();
  }
  function loop(now){
    if(!document.hidden)frame(now);
    requestAnimationFrame(loop);
  }

  function resize(){
    dpr=Math.min(2,window.devicePixelRatio||1);W=sky.clientWidth;H=sky.clientHeight;if(!W||!H)return;
    sky.width=Math.round(W*dpr);sky.height=Math.round(H*dpr);sot.length=0;build();frame(performance.now());
  }
  let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120);}).observe(sky);
  // миша: підсвічуємо, поки курсор над зіркою; дотик: підсвічуємо на 4 с або до наступного дотику
  sky.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')ptr={x:e.clientX,y:e.clientY};});
  sky.addEventListener('pointerleave',()=>{ptr=null;});
  sky.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;tap=starAt(e.clientX,e.clientY,shiftAt(performance.now()),30);tapAt=performance.now();});
  function addDonation(v,key,time,animate,delay,sig){
    DONATIONS.push(v);KEYS.push(key);TIMES.push(time||0);SIGS.push(sig||null);known.add(key);const i=sotky++;idx.set(key,i);
    if(!animate)return;
    if(waitFrom&&(time||0)*1000>=waitFrom-60000)endWait(); // схоже, це та сама зірка, на яку чекали
    const now=performance.now()+(delay||0);
    if(reduce){born[i]=now;labels.push({i,start:now});return;}
    born[i]=null;spawnMeteor(now,i);
  }
  function plz(n){const a=n%10,b=n%100;if(a===1&&b!==11)return 'зірка';if(a>=2&&a<=4&&(b<12||b>14))return 'зірки';return 'зірок';}
  function showCount(){document.getElementById('stars').innerHTML='<b>'+sotky+'</b>'+plz(sotky);}
  const cta=document.querySelector('.cta'),CTA=cta.textContent;
  function showWait(){cta.textContent=waitFrom?'Чекаємо на вашу зірку…':CTA;cta.classList.toggle('wait',!!waitFrom);}
  // момент натискання зберігаємо в sessionStorage, тобто лише в цій вкладці: переживе перезавантаження на телефоні, але новий захід на сайт починається зі звичайної кнопки
  function startWait(){waitFrom=Date.now();try{sessionStorage.setItem('lom-wait',String(waitFrom));}catch(e){}showWait();}
  function endWait(){waitFrom=0;try{sessionStorage.removeItem('lom-wait');}catch(e){}showWait();}
  function waiting(){if(waitFrom&&Date.now()-waitFrom>WAIT_MS)endWait();return !!waitFrom;}
  try{const v=+sessionStorage.getItem('lom-wait');if(v&&Date.now()-v<WAIT_MS)waitFrom=v;}catch(e){}
  showWait();
  cta.addEventListener('click',startWait);

  let loaded=false,busy=false,lastPoll=0;
  async function poll(){
    if(busy)return;busy=true;lastPoll=Date.now();
    try{
      // ?fresh=1 просить Worker одразу перевірити Monobank, а не чекати свого розкладу
      const r=await fetch(API+(waiting()?'?fresh=1':''),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();let j=0;
      // після перезавантаження вкладки під час очікування свіжі зірки теж прилітають метеором
      // підпис може з'явитися й у старої зірки: людина щойно вперше написала «★ Ім'я»
      for(const [k,a,t,n] of data.stars||[]){if(known.has(k)){SIGS[idx.get(k)]=n||null;continue;}addDonation(a,k,t,loaded||(waitFrom&&t*1000>=waitFrom-60000),(j++)*900,n);}
      loaded=true;showCount();
    }catch(e){if(!loaded)document.getElementById('stars').textContent='небо поки недоступне';}
    finally{busy=false;}
  }
  poll();
  // тест: відкрийте сторінку з ?test в адресі й викличте в консолі testStar(500) або testStar(500, 'Паша')
  if(/[?&]test\b/.test(location.search))window.testStar=(amount,name)=>{addDonation(Number(amount)||100,'test-'+Date.now()+'-'+Math.random(),Math.floor(Date.now()/1000),true,0,name);showCount();};
  setInterval(()=>{if(!document.hidden&&(waiting()?true:Date.now()-lastPoll>=POLL_MS))poll();},WAIT_POLL_MS);
  // людина повернулась із Monobank: одразу перевіряємо, чи не прилетіла її зірка
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
  resize();
  if(reduce){addEventListener('resize',()=>frame(performance.now()));}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
